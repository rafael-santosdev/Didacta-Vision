{% extends 'didacta/base.html' %}

{% block title %}Deletar Comentário - Didacta Vision{% endblock %}

{% block content %}
<section class="dv-section">
    <div class="dv-dialog">
        <div class="dv-dialog__icon" style="background:rgba(239,68,68,0.2);color:#f87171;">
            <i class="bi bi-chat-x"></i>
        </div>
        <h2>Excluir comentário?</h2>
        <p class="text-muted">Esta resposta será removida imediatamente para todos os usuários.</p>

        <div class="dv-card-wide" style="margin-top:18px;">
            <p class="text-muted" style="margin:0;">{{ comentario.texto|truncatewords:20 }}</p>
        </div>

        <form method="post" class="dv-dialog__actions">
            {% csrf_token %}
            <a href="{% url 'didacta:film_detail' comentario.filme.pk %}" class="dv-btn ghost">Cancelar</a>
            <button type="submit" class="dv-btn primary">
                <i class="bi bi-trash"></i> Sim, deletar
            </button>
        </form>
    </div>
</section>
{% endblock %}
