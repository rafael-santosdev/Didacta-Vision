{% extends 'didacta/base.html' %}

{% block title %}Deletar Comentário - Didacta Vision{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow border-danger">
            <div class="card-body p-5 text-center">
                <h2 class="mb-4 text-danger">
                    <i class="bi bi-exclamation-triangle"></i> Deletar Comentário
                </h2>
                
                <div class="alert alert-danger mb-4">
                    <p class="mb-0">{{ comentario.texto|truncatewords:20 }}</p>
                </div>
                
                <p class="lead">Tem certeza que deseja deletar este comentário?</p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-grid gap-2 d-md-flex justify-content-md-center mt-4">
                        <a href="{% url 'didacta:film_detail' comentario.filme.pk %}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash"></i> Sim, deletar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
