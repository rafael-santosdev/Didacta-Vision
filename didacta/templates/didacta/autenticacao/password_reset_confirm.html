{% extends 'didacta/base.html' %}

{% block title %}Nova Senha - Didacta Vision{% endblock %}

{% block content %}
<section class="dv-section">
    <div class="dv-form-card">
        <h2><i class="bi bi-key-fill"></i> Nova Senha</h2>
        
        <div class="dv-panel" style="background:rgba(16,185,129,0.08); border-color:rgba(16,185,129,0.25); margin-bottom:24px;">
            <i class="bi bi-check-circle"></i> 
            Código verificado com sucesso! Agora defina sua nova senha.
        </div>
        
        <form method="post" class="dv-form">
            {% csrf_token %}
            <div class="dv-form-group">
                <label for="password1">Nova Senha</label>
                <input type="password" id="password1" name="password1" 
                       placeholder="Digite sua nova senha" required minlength="8">
                <small class="text-muted">A senha deve ter pelo menos 8 caracteres</small>
            </div>
            <div class="dv-form-group">
                <label for="password2">Confirmar Nova Senha</label>
                <input type="password" id="password2" name="password2" 
                       placeholder="Confirme sua nova senha" required minlength="8">
            </div>
            <div class="dv-form-actions">
                <button type="submit" class="dv-btn primary">
                    <i class="bi bi-check-circle"></i> Alterar Senha
                </button>
            </div>
        </form>
    </div>
</section>
{% endblock %}
