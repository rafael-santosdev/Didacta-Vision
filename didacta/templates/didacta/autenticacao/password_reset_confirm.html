{% extends 'didacta/base.html' %}

{% block title %}Nova Senha - Didacta Vision{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow">
            <div class="card-body p-5">
                <h2 class="text-center mb-4">
                    <i class="bi bi-key-fill"></i> Nova Senha
                </h2>
                
                <div class="alert alert-success mb-4">
                    <i class="bi bi-check-circle"></i> 
                    Código verificado com sucesso! Agora defina sua nova senha.
                </div>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="password1" class="form-label">Nova Senha</label>
                        <input type="password" class="form-control" id="password1" name="password1" 
                               placeholder="Digite sua nova senha" required minlength="8">
                        <small class="form-text text-muted">A senha deve ter pelo menos 8 caracteres</small>
                    </div>
                    <div class="mb-3">
                        <label for="password2" class="form-label">Confirmar Nova Senha</label>
                        <input type="password" class="form-control" id="password2" name="password2" 
                               placeholder="Confirme sua nova senha" required minlength="8">
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-check-circle"></i> Alterar Senha
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
