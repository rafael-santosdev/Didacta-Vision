{% extends 'didacta/base.html' %}
{% load static %}

{% block title %}Definir Nova Senha - Didacta Vision{% endblock %}

{% block content %}
<div class="container-xl d-flex align-items-center justify-content-center py-5" style="min-height: calc(100vh - 180px);">
    <div class="dv-auth-card p-4 p-md-5">
        <div class="text-center mb-4">
            <span class="dv-logo__icon mx-auto mb-3" style="width:48px;height:48px;font-size:1.4rem;">
                <i class="bi bi-lock"></i>
            </span>
            <h1 class="fs-3 text-white fw-bold mb-1">Definir Nova Senha</h1>
            <p class="text-muted" style="font-size:0.9rem;">Escolha uma senha segura para proteger sua conta</p>
        </div>

        <form method="post" class="dv-form">
            {% csrf_token %}
            <div class="dv-form-group mb-3">
                <label for="password1" class="form-label text-white fw-medium">Nova Senha *</label>
                <input type="password" id="password1" name="password1" class="form-control dv-form-control" placeholder="••••••••" required minlength="8" autofocus>
                <small class="text-muted">Mínimo de 8 caracteres</small>
            </div>

            <div class="dv-form-group mb-4">
                <label for="password2" class="form-label text-white fw-medium">Confirmar Nova Senha *</label>
                <input type="password" id="password2" name="password2" class="form-control dv-form-control" placeholder="••••••••" required minlength="8">
            </div>

            <button type="submit" class="dv-btn primary w-100 justify-content-center py-2 fs-6">
                <i class="bi bi-check2-circle me-1"></i> Salvar Nova Senha
            </button>
        </form>
    </div>
</div>
{% endblock %}
