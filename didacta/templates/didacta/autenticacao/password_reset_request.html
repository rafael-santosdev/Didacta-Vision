{% extends 'didacta/base.html' %}

{% block title %}Recuperar Senha - Didacta Vision{% endblock %}

{% block content %}
<section class="dv-section">
    <div class="dv-form-card">
        <h2><i class="bi bi-key"></i> Recuperar Senha</h2>
        
        <div class="dv-panel" style="background:rgba(59,130,246,0.08); border-color:rgba(59,130,246,0.25); margin-bottom:24px;">
            <i class="bi bi-info-circle"></i> 
            Digite seu email cadastrado e enviaremos um código de verificação para você redefinir sua senha.
        </div>
        
        <form method="post" class="dv-form">
            {% csrf_token %}
            <div class="dv-form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Digite seu email" required>
            </div>
            <div class="dv-form-actions">
                <button type="submit" class="dv-btn primary">
                    <i class="bi bi-send"></i> Enviar Código
                </button>
            </div>
        </form>
        
        <div style="margin-top:24px; text-align:center;">
            <a href="{% url 'didacta:login' %}" class="dv-btn ghost">
                <i class="bi bi-arrow-left"></i> Voltar ao Login
            </a>
        </div>
    </div>
</section>
{% endblock %}
