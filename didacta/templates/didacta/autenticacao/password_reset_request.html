{% extends 'didacta/base.html' %}

{% block title %}Recuperar Senha - Didacta Vision{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow">
            <div class="card-body p-5">
                <h2 class="text-center mb-4">
                    <i class="bi bi-key"></i> Recuperar Senha
                </h2>
                
                <div class="alert alert-info mb-4">
                    <i class="bi bi-info-circle"></i> 
                    Digite seu email cadastrado e enviaremos um código de verificação para você redefinir sua senha.
                </div>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" 
                               placeholder="Digite seu email" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-send"></i> Enviar Código
                        </button>
                    </div>
                </form>
                
                <hr class="my-4">
                
                <div class="text-center">
                    <a href="{% url 'didacta:login' %}" class="text-decoration-none">
                        <i class="bi bi-arrow-left"></i> Voltar ao Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
