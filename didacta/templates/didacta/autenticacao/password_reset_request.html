{% extends 'didacta/base.html' %}
{% load static %}

{% block title %}Recuperação de Senha - Didacta Vision{% endblock %}

{% block content %}
<div class="container-xl d-flex align-items-center justify-content-center py-5" style="min-height: calc(100vh - 180px);">
    <div class="dv-auth-card p-4 p-md-5">
        <div class="text-center mb-4">
            <span class="dv-logo__icon mx-auto mb-3" style="width:48px;height:48px;font-size:1.4rem;">
                <i class="bi bi-key"></i>
            </span>
            <h1 class="fs-3 text-white fw-bold mb-1">Recuperar Senha</h1>
            <p class="text-muted" style="font-size:0.9rem;">Enviaremos um código de segurança para o seu e-mail</p>
        </div>

        <form method="post" class="dv-form">
            {% csrf_token %}
            <div class="dv-form-group mb-3">
                <label for="email" class="form-label text-white fw-medium">Seu E-mail Cadastrado *</label>
                <div class="input-group">
                    <span class="input-group-text dv-input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" id="email" name="email" class="form-control dv-form-control" placeholder="ex: seu@email.com" required autofocus autocomplete="email">
                </div>
            </div>

            <button type="submit" class="dv-btn primary w-100 justify-content-center py-2 mt-4 fs-6">
                <i class="bi bi-send me-1"></i> Enviar Código de Verificação
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
            <a href="{% url 'didacta:login' %}" class="text-white small text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i> Voltar para a tela de login
            </a>
        </div>
    </div>
</div>
{% endblock %}
