{% extends 'didacta/base.html' %}
{% load static %}

{% block title %}Validar Código de Redefinição - Didacta Vision{% endblock %}

{% block content %}
<div class="container-xl d-flex align-items-center justify-content-center py-5" style="min-height: calc(100vh - 180px);">
    <div class="dv-auth-card p-4 p-md-5">
        <div class="text-center mb-4">
            <span class="dv-logo__icon mx-auto mb-3" style="width:48px;height:48px;font-size:1.4rem;">
                <i class="bi bi-shield-check"></i>
            </span>
            <h1 class="fs-3 text-white fw-bold mb-1">Validar Código</h1>
            <p class="text-muted" style="font-size:0.9rem;">Insira o código de 6 dígitos enviado para <strong>{{ user.email }}</strong></p>
        </div>

        <form method="post" class="dv-form">
            {% csrf_token %}
            <div class="dv-form-group mb-4">
                <input type="text" id="codigo" name="codigo" maxlength="6" pattern="[0-9]{6}" required 
                       placeholder="000000" class="form-control dv-form-control text-center py-2 fs-2 fw-bold" 
                       style="letter-spacing: 0.6rem;" autofocus autocomplete="one-time-code">
            </div>

            <button type="submit" class="dv-btn primary w-100 justify-content-center py-2 fs-6">
                <i class="bi bi-check2-circle me-1"></i> Verificar Código
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
            <a href="{% url 'didacta:password_reset_request' %}" class="text-white small text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i> Enviar para outro e-mail
            </a>
        </div>
    </div>
</div>
{% endblock %}
